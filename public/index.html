<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    
    <!-- Title & Description for SEO -->
    <title>My React App | Innovative Web Solutions</title>
    <meta name="description" content="A modern web application built using React. Experience fast, responsive, and user-friendly design.">
    
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon.ico">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="My React App">
    <meta property="og:description" content="A modern web application built using React.">
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png">
    <meta property="og:url" content="https://yourwebsite.com">
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="My React App">
    <meta name="twitter:description" content="A modern web application built using React.">
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter-image.png">
    
    <!-- Theme & Color -->
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    
    <!-- Preconnect to improve font loading speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Custom Styles (Optional) -->
    <link rel="stylesheet" href="%PUBLIC_URL%/styles.css">

</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Root React App -->
    <div id="root"></div>
    
    <!-- Analytics Script (Optional) -->
    <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=YOUR_TRACKING_ID"></script> -->
</body>
</html>
